<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Packing Slip Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .item-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .item-row input {
            flex: 1;
        }

        button {
            cursor: pointer;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
        }

        .btn-add {
            background-color: #007bff;
            color: white;
            margin-bottom: 15px;
        }

        .btn-submit {
            background-color: #28a745;
            color: white;
            width: 100%;
            font-size: 16px;
        }

        .btn-print {
            background-color: #17a2b8;
            color: white;
            margin-top: 15px;
            width: 100%;
            display: none;
        }

        /* Slip Preview Design */
        #slip-preview {
            display: none;
            margin-top: 30px;
            border: 2px dashed #333;
            padding: 20px;
            background: #fff;
        }

        .slip-header {
            display: flex;
            justify-content: space-between;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }

        .slip-addresses {
            display: flex;
            justify-content: space-between;
            margin: 20px 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        table, th, td {
            border: 1px solid #ddd;
        }

        th, td {
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        /* Print Settings */
        @media print {
            body * {
                visibility: hidden;
            }
            #slip-preview, #slip-preview * {
                visibility: visible;
            }
            #slip-preview {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                border: none;
            }
            .btn-print {
                display: none !important;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Packing Slip Generator</h2>

    <!-- Input Form -->
    <form id="packingForm">
        <div class="form-group">
            <label for="orderNo">Order Number / Order ID</label>
            <input type="text" id="orderNo" required placeholder="e.g. #ORD-10023">
        </div>

        <div class="form-group">
            <label for="orderDate">Date</label>
            <input type="date" id="orderDate" required>
        </div>

        <div class="form-group">
            <label for="sellerDetails">Seller / Sender Address</label>
            <textarea id="sellerDetails" rows="3" required placeholder="Company Name, Address, Contact..."></textarea>
        </div>

        <div class="form-group">
            <label for="customerDetails">Customer / Delivery Address</label>
            <textarea id="customerDetails" rows="3" required placeholder="Customer Name, Address, Phone..."></textarea>
        </div>

        <label>Item List</label>
        <div id="itemList">
            <div class="item-row">
                <input type="text" placeholder="Item Description" class="item-name" required>
                <input type="number" placeholder="Qty" class="item-qty" min="1" required style="max-width: 100px;">
            </div>
        </div>
        <button type="button" class="btn-add" onclick="addItemRow()">+ Add More Item</button>

        <button type="submit" class="btn-submit">Generate Packing Slip</button>
    </form>

    <!-- Slip Preview Area -->
    <div id="slip-preview">
        <div class="slip-header">
            <div>
                <h2>PACKING SLIP</h2>
                <p><strong>Order ID:</strong> <span id="outOrderNo"></span></p>
            </div>
            <div>
                <p><strong>Date:</strong> <span id="outDate"></span></p>
            </div>
        </div>

        <div class="slip-addresses">
            <div style="width: 45%;">
                <strong>From (Sender):</strong>
                <p id="outSeller" style="white-space: pre-line;"></p>
            </div>
            <div style="width: 45%;">
                <strong>Ship To (Customer):</strong>
                <p id="outCustomer" style="white-space: pre-line;"></p>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>S.No.</th>
                    <th>Item Description</th>
                    <th style="width: 80px; text-align: center;">Qty</th>
                </tr>
            </thead>
            <tbody id="outItemsTable"></tbody>
        </table>

        <button class="btn-print" onclick="window.print()">Print Packing Slip</button>
    </div>
</div>

<script>
    // Add Item Row dynamically
    function addItemRow() {
        const itemContainer = document.getElementById('itemList');
        const newRow = document.createElement('div');
        newRow.className = 'item-row';
        newRow.innerHTML = `
            <input type="text" placeholder="Item Description" class="item-name" required>
            <input type="number" placeholder="Qty" class="item-qty" min="1" required style="max-width: 100px;">
        `;
        itemContainer.appendChild(newRow);
    }

    // Form Submit Event
    document.getElementById('packingForm').addEventListener('submit', function(e) {
        e.preventDefault();

        // Populate header details
        document.getElementById('outOrderNo').innerText = document.getElementById('orderNo').value;
        document.getElementById('outDate').innerText = document.getElementById('orderDate').value;
        document.getElementById('outSeller').innerText = document.getElementById('sellerDetails').value;
        document.getElementById('outCustomer').innerText = document.getElementById('customerDetails').value;

        // Populate items table
        const itemsTable = document.getElementById('outItemsTable');
        itemsTable.innerHTML = '';

        const itemNames = document.querySelectorAll('.item-name');
        const itemQtys = document.querySelectorAll('.item-qty');

        itemNames.forEach((item, index) => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${index + 1}</td>
                <td>${item.value}</td>
                <td style="text-align: center;">${itemQtys[index].value}</td>
            `;
            itemsTable.appendChild(row);
        });

        // Show slip preview and print button
        document.getElementById('slip-preview').style.display = 'block';
        document.querySelector('.btn-print').style.display = 'block';

        // Scroll down to slip preview
        document.getElementById('slip-preview').scrollIntoView({ behavior: 'smooth' });
    });
</script>

</body>
</html>
