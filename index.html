<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-File Order Matching & Analysis</title>
    <!-- XLSX library for parsing Excel/CSV files -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- JsBarcode library -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #eef2f5; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; background: #ffffff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h1 { text-align: center; color: #1a252f; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #666; margin-bottom: 25px; font-size: 14px; }
        
        .upload-section {
            border: 2px dashed #007bff;
            background-color: #f8f9fa;
            padding: 35px 25px;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 20px;
            cursor: pointer;
            transition: 0.3s;
        }
        .upload-section:hover, .upload-section.dragover { background-color: #e9ecef; border-color: #0056b3; }
        input[type="file"] { display: none; }
        
        .custom-file-upload {
            display: inline-block;
            padding: 12px 24px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border-radius: 5px;
            font-weight: bold;
            font-size: 15px;
        }
        
        .btn-action { display: inline-block; margin: 5px; padding: 10px 18px; color: white; border-radius: 5px; font-size: 14px; font-weight: bold; cursor: pointer; border: none; }
        .btn-green { background-color: #28a745; }
        .btn-blue { background-color: #17a2b8; }
        .btn-secondary { background-color: #6c757d; }

        .controls-area { display: none; margin-top: 20px; background: #f1f3f5; padding: 15px; border-radius: 6px; }
        .search-box { width: 100%; padding: 10px 15px; font-size: 15px; border: 1px solid #ced4da; border-radius: 5px; margin-top: 8px; }
        #file-list { margin-top: 15px; font-size: 14px; color: #28a745; text-align: left; }
        
        .table-responsive { max-height: 500px; overflow-y: auto; margin-top: 15px; border: 1px solid #dee2e6; }
        .data-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .data-table th, .data-table td { border: 1px solid #dee2e6; padding: 8px; text-align: left; }
        .data-table th { background-color: #343a40; color: white; position: sticky; top: 0; z-index: 10; }
        .data-table tr:nth-child(even) { background-color: #f8f9fa; }
        
        .slips-wrapper { margin-top: 30px; }
        .packing-slip { background: #fff; border: 2px solid #222; padding: 20px; margin-bottom: 30px; page-break-after: always; border-radius: 4px; }
        .slip-header { display: flex; justify-content: space-between; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 15px; }
        .slip-title { font-size: 20px; font-weight: bold; text-transform: uppercase; }
        .barcode-container svg { max-width: 220px; height: 45px; }
        .items-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .items-table th, .items-table td { border: 1px solid #333; padding: 8px; text-align: left; font-size: 12px; }
        .items-table th { background-color: #f0f0f0; }

        @media print {
            body { background: white; padding: 0; }
            .no-print { display: none !important; }
            .container { box-shadow: none; padding: 0; max-width: 100%; }
            .packing-slip { border: 1px solid #000; margin-bottom: 0; page-break-after: always; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="no-print">
        <h1>Multi-File Order Matching & Analysis</h1>
        <p class="subtitle">Myntra PO, Delivery Challan & Sales Order Reports ka merged automated data view</p>

        <div class="upload-section" id="dropZone" onclick="document.getElementById('excelFiles').click()">
            <label class="custom-file-upload">
                📁 Upload All Files (PO, Challan, Sales Order)
            </label>
            <p style="margin-top: 10px; color: #777; font-size: 13px;">(Aap ek saath saari files select karke upload karein ya yahan drag-drop karein)</p>
            <input type="file" id="excelFiles" accept=".xlsx, .xls, .csv" multiple onchange="handleFilesUpload(event.target.files)">
            <div id="file-list"></div>
        </div>

        <div id="controlsArea" class="controls-area">
            <div>
                <strong>🔎 Search Order Data:</strong>
                <input type="text" id="searchInput" class="search-box" placeholder="Search by PO No, Barcode, SKU Code, Style ID..." onkeyup="filterOrders()">
            </div>
            <div style="margin-top: 15px;">
                <button class="btn-action btn-green" onclick="exportMergedExcel()">📊 Export Matched Excel Report</button>
                <button class="btn-action btn-blue" onclick="window.print()">🖨️ Print Packing Slips</button>
            </div>
        </div>

        <div id="summaryTableContainer" class="table-responsive"></div>
    </div>

    <div id="slipsContainer" class="slips-wrapper"></div>
</div>

<script>
    let globalMergedData = [];

    // Drag-and-drop Handlers
    const dropZone = document.getElementById('dropZone');
    ['dragenter', 'dragover'].forEach(name => {
        dropZone.addEventListener(name, (e) => { e.preventDefault(); dropZone.classList.add('dragover'); }, false);
    });
    ['dragleave', 'drop'].forEach(name => {
        dropZone.addEventListener(name, (e) => { e.preventDefault(); dropZone.classList.remove('dragover'); }, false);
    });
    dropZone.addEventListener('drop', (e) => {
        const dt = e.dataTransfer;
        if (dt.files && dt.files.length > 0) handleFilesUpload(dt.files);
    });

    function cleanKey(val) {
        if (!val) return '';
        let str = String(val).trim().replace(/\.0$/, '');
        return str.replace(/^0+/, '');
    }

    function parseSheetSmartly(worksheet) {
        let rawJson = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });
        if (rawJson.length === 0) return [];

        let headerIdx = 0;
        for (let i = 0; i < Math.min(rawJson.length, 15); i++) {
            let rowStr = rawJson[i].map(c => String(c)).join(' ');
            if (rowStr.includes('SKU Code') || rowStr.includes('BARCODE') || rowStr.includes('GTIN') || rowStr.includes('Reserved Qty') || rowStr.includes('REMARKS')) {
                headerIdx = i;
                break;
            }
        }

        let headers = rawJson[headerIdx].map(h => String(h).trim());
        let result = [];
        for (let i = headerIdx + 1; i < rawJson.length; i++) {
            let row = rawJson[i];
            if (!row || row.length === 0) continue;
            let obj = {};
            headers.forEach((h, colIdx) => {
                if (h) obj[h] = row[colIdx] !== undefined ? row[colIdx] : "";
            });
            result.push(obj);
        }
        return result;
    }

    function handleFilesUpload(files) {
        if (!files || files.length === 0) return;

        let fileListHtml = "<strong>Uploaded Files:</strong><ul style='margin-top:5px;'>";
        for (let f of files) {
            fileListHtml += `<li>📄 ${f.name}</li>`;
        }
        fileListHtml += "</ul>";
        document.getElementById('file-list').innerHTML = fileListHtml;

        let readPromises = [];
        let parsedDatasets = [];

        for (let i = 0; i < files.length; i++) {
            readPromises.push(new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const data = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    
                    let allRows = [];
                    workbook.SheetNames.forEach(sheetName => {
                        const worksheet = workbook.Sheets[sheetName];
                        const rows = parseSheetSmartly(worksheet);
                        allRows = allRows.concat(rows);
                    });

                    parsedDatasets.push({ fileName: files[i].name, rows: allRows });
                    resolve();
                };
                reader.readAsArrayBuffer(files[i]);
            }));
        }

        Promise.all(readPromises).then(() => {
            mergeAndAnalyzeData(parsedDatasets);
        });
    }

    function mergeAndAnalyzeData(datasets) {
        let masterMap = {};

        datasets.forEach(ds => {
            ds.rows.forEach(row => {
                // Key Identifiers
                let rawEan = row.BARCODE || row.Barcode || row.GTIN || row['Ean code'] || row.EAN || '';
                let eanKey = cleanKey(rawEan);

                let skuCode = row['SKU Code'] || row.SKU || row['ITEM CODE'] || row['Vendor Article Number'] || '';
                let cleanSku = cleanKey(skuCode);

                let primaryKey = eanKey || cleanSku;
                if (!primaryKey) return;

                // Field Extractions
                let poNum = row['PO NO'] || row['PO Number'] || row['PARTY ORDER NO'] || row['Sale Order No'] || row.po || row.PO_NO || '';
                let skuId = row['SKU Id'] || row.SKU_ID || row['Sku Id'] || '';
                let styleId = row['Style Id'] || row.STYLE_ID || row['Style ID'] || '';
                let itemName = row['Vendor Article Name'] || row.ItemName || row['ITEAM NAME'] || row['ITEM_NAME'] || '';
                let landingPrice = parseFloat(row['Landing Price'] || row.Rate || row.RATE || row.MRP || 0);

                // Reserved Qty (from Sales Order Report)
                let reservedQty = parseFloat(row['Reserved Qty'] || row['RESERVED_QTY'] || row.Qty || row.Quantity || 0);

                // Box No (from REMARKS of Delivery Challan)
                let boxNo = row.REMARKS || row.Remarks || row.BoxNo || row['box num'] || '';
                if (typeof boxNo === 'string' && boxNo.match(/\d+/)) {
                    boxNo = boxNo.match(/\d+/)[0];
                }

                if (!masterMap[primaryKey]) {
                    masterMap[primaryKey] = {
                        PONumber: poNum,
                        Barcode: rawEan || eanKey,
                        SKUId: skuId,
                        StyleId: styleId,
                        SKUCode: skuCode || cleanSku,
                        ArticleName: itemName,
                        LandingPrice: landingPrice ? Number(landingPrice.toFixed(2)) : 0,
                        ReservedQty: reservedQty,
                        BoxNo: boxNo || 1
                    };
                } else {
                    if (poNum) masterMap[primaryKey].PONumber = poNum;
                    if (skuId) masterMap[primaryKey].SKUId = skuId;
                    if (styleId) masterMap[primaryKey].StyleId = styleId;
                    if (itemName) masterMap[primaryKey].ArticleName = itemName;
                    if (landingPrice > 0) masterMap[primaryKey].LandingPrice = Number(landingPrice.toFixed(2));
                    if (reservedQty > 0) masterMap[primaryKey].ReservedQty = reservedQty;
                    if (boxNo) masterMap[primaryKey].BoxNo = boxNo;
                }
            });
        });

        globalMergedData = Object.values(masterMap);

        if (globalMergedData.length === 0) {
            alert('Data process nahi ho saka. Kripya check karein ki sahi Excel files upload hui hain.');
            return;
        }

        document.getElementById('controlsArea').style.display = 'block';
        renderSummaryTable(globalMergedData);
        generateSlips(globalMergedData);
    }

    function renderSummaryTable(data) {
        let html = `
            <table class="data-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>PO Number</th>
                        <th>BARCODE</th>
                        <th>SKU Id</th>
                        <th>Style Id</th>
                        <th>SKU Code</th>
                        <th>Article / Item Name</th>
                        <th>Landing Price (₹)</th>
                        <th>Reserved Qty</th>
                        <th>Box No (Remarks)</th>
                    </tr>
                </thead>
                <tbody>
        `;

        data.forEach((item, idx) => {
            html += `
                <tr>
                    <td>${idx + 1}</td>
                    <td><strong>${item.PONumber || '-'}</strong></td>
                    <td>${item.Barcode || '-'}</td>
                    <td>${item.SKUId || '-'}</td>
                    <td>${item.StyleId || '-'}</td>
                    <td>${item.SKUCode || '-'}</td>
                    <td>${item.ArticleName || '-'}</td>
                    <td>${item.LandingPrice || 0}</td>
                    <td><strong>${item.ReservedQty || 0}</strong></td>
                    <td>${item.BoxNo || '-'}</td>
                </tr>
            `;
        });

        html += `</tbody></table>`;
        document.getElementById('summaryTableContainer').innerHTML = html;
    }

    function filterOrders() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        const filtered = globalMergedData.filter(item => {
            return String(item.PONumber).toLowerCase().includes(query) ||
                   String(item.Barcode).toLowerCase().includes(query) ||
                   String(item.SKUId).toLowerCase().includes(query) ||
                   String(item.StyleId).toLowerCase().includes(query) ||
                   String(item.SKUCode).toLowerCase().includes(query) ||
                   String(item.ArticleName).toLowerCase().includes(query);
        });

        renderSummaryTable(filtered);
        generateSlips(filtered);
    }

    function generateSlips(data) {
        const container = document.getElementById('slipsContainer');
        container.innerHTML = '';

        const grouped = {};
        data.forEach(row => {
            const key = row.PONumber || 'PO-MAIN';
            if (!grouped[key]) grouped[key] = [];
            grouped[key].push(row);
        });

        let idx = 0;
        for (let poNum in grouped) {
            idx++;
            const items = grouped[poNum];
            const first = items[0];
            const barcodeId = "barcode-" + idx;

            const slipHtml = `
                <div class="packing-slip">
                    <div class="slip-header">
                        <div>
                            <div class="slip-title">Packing Slip</div>
                            <div style="font-size:13px; margin-top:5px;">
                                <strong>PO No:</strong> ${poNum} | 
                                <strong>Box No:</strong> ${first.BoxNo}
                            </div>
                        </div>
                        <div class="barcode-container">
                            <svg id="${barcodeId}"></svg>
                        </div>
                    </div>

                    <table class="items-table">
                        <thead>
                            <tr>
                                <th style="width: 6%;">#</th>
                                <th style="width: 18%;">SKU Code</th>
                                <th style="width: 16%;">SKU Id / Style Id</th>
                                <th style="width: 32%;">Vendor Article Name</th>
                                <th style="width: 16%;">Barcode</th>
                                <th style="width: 12%; text-align: center;">Reserved Qty</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${items.map((item, i) => `
                                <tr>
                                    <td>${i + 1}</td>
                                    <td>${item.SKUCode}</td>
                                    <td>${item.SKUId} / ${item.StyleId}</td>
                                    <td>${item.ArticleName}</td>
                                    <td>${item.Barcode}</td>
                                    <td style="text-align: center; font-weight:bold;">${item.ReservedQty}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;

            container.insertAdjacentHTML('beforeend', slipHtml);

            JsBarcode("#" + barcodeId, String(poNum), {
                format: "CODE128",
                width: 1.5,
                height: 40,
                displayValue: true,
                fontSize: 12
            });
        }
    }

    function exportMergedExcel() {
        if (globalMergedData.length === 0) return;
        const worksheet = XLSX.utils.json_to_sheet(globalMergedData);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Matched PO Data");
        XLSX.writeFile(workbook, "Matched_PO_Report.xlsx");
    }
</script>

</body>
</html>
