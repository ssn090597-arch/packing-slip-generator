<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-File Order Matching & Analysis</title>
    <!-- XLSX library for parsing Excel/CSV files -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- JsBarcode library -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #eef2f5; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1100px; margin: 0 auto; background: #ffffff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h1 { text-align: center; color: #1a252f; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #666; margin-bottom: 25px; font-size: 14px; }
        
        .upload-section {
            border: 2px dashed #007bff;
            background-color: #f8f9fa;
            padding: 35px 25px;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 20px;
            cursor: pointer;
            transition: 0.3s;
        }
        .upload-section:hover, .upload-section.dragover { background-color: #e9ecef; border-color: #0056b3; }
        input[type="file"] { display: none; }
        
        .custom-file-upload {
            display: inline-block;
            padding: 12px 24px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border-radius: 5px;
            font-weight: bold;
            font-size: 15px;
        }
        
        .btn-action { display: inline-block; margin: 5px; padding: 10px 18px; color: white; border-radius: 5px; font-size: 14px; font-weight: bold; cursor: pointer; border: none; }
        .btn-green { background-color: #28a745; }
        .btn-blue { background-color: #17a2b8; }
        .btn-secondary { background-color: #6c757d; }

        .controls-area { display: none; margin-top: 20px; background: #f1f3f5; padding: 15px; border-radius: 6px; }
        .search-box { width: 100%; padding: 10px 15px; font-size: 15px; border: 1px solid #ced4da; border-radius: 5px; margin-top: 8px; }
        #file-list { margin-top: 15px; font-size: 14px; color: #28a745; text-align: left; }
        
        .table-responsive { max-height: 450px; overflow-y: auto; margin-top: 15px; border: 1px solid #dee2e6; }
        .data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .data-table th, .data-table td { border: 1px solid #dee2e6; padding: 8px; text-align: left; }
        .data-table th { background-color: #343a40; color: white; position: sticky; top: 0; }
        .data-table tr:nth-child(even) { background-color: #f8f9fa; }
        
        .slips-wrapper { margin-top: 30px; }
        .packing-slip { background: #fff; border: 2px solid #222; padding: 20px; margin-bottom: 30px; page-break-after: always; border-radius: 4px; }
        .slip-header { display: flex; justify-content: space-between; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 15px; }
        .slip-title { font-size: 20px; font-weight: bold; text-transform: uppercase; }
        .barcode-container svg { max-width: 220px; height: 45px; }
        .items-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .items-table th, .items-table td { border: 1px solid #333; padding: 8px; text-align: left; font-size: 13px; }
        .items-table th { background-color: #f0f0f0; }

        @media print {
            body { background: white; padding: 0; }
            .no-print { display: none !important; }
            .container { box-shadow: none; padding: 0; max-width: 100%; }
            .packing-slip { border: 1px solid #000; margin-bottom: 0; page-break-after: always; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="no-print">
        <h1>Multi-File Order Matching & Analysis</h1>
        <p class="subtitle">Excel/CSV Files (PO, Sale Report, Challan) upload karke Order Data matching & analysis karein</p>

        <div class="upload-section" id="dropZone" onclick="document.getElementById('excelFiles').click()">
            <label class="custom-file-upload">
                📁 Upload Multiple Files (PO, Sale, Challan)
            </label>
            <p style="margin-top: 10px; color: #777; font-size: 13px;">(Aap ek saath multiple files select kar sakte hain ya drag-and-drop karein)</p>
            <input type="file" id="excelFiles" accept=".xlsx, .xls, .csv" multiple onchange="handleFilesUpload(event.target.files)">
            <div id="file-list"></div>
        </div>

        <div id="controlsArea" class="controls-area">
            <div>
                <strong>🔎 Search / Filter Order Data:</strong>
                <input type="text" id="searchInput" class="search-box" placeholder="Type Order ID, Invoice Number, Barcode, or SKU..." onkeyup="filterOrders()">
            </div>
            <div style="margin-top: 15px;">
                <button class="btn-action btn-green" onclick="exportMergedExcel()">📊 Export Matched Excel Data</button>
                <button class="btn-action btn-blue" onclick="window.print()">🖨️ Print Packing Slips</button>
            </div>
        </div>

        <div id="summaryTableContainer" class="table-responsive"></div>
    </div>

    <div id="slipsContainer" class="slips-wrapper"></div>
</div>

<script>
    let globalMergedData = [];

    // Setup Drag and Drop
    const dropZone = document.getElementById('dropZone');
    ['dragenter', 'dragover'].forEach(name => {
        dropZone.addEventListener(name, (e) => { e.preventDefault(); dropZone.classList.add('dragover'); }, false);
    });
    ['dragleave', 'drop'].forEach(name => {
        dropZone.addEventListener(name, (e) => { e.preventDefault(); dropZone.classList.remove('dragover'); }, false);
    });
    dropZone.addEventListener('drop', (e) => {
        const dt = e.dataTransfer;
        if (dt.files && dt.files.length > 0) handleFilesUpload(dt.files);
    });

    function cleanKey(val) {
        if (!val) return '';
        let str = String(val).trim().replace(/\.0$/, '');
        return str.replace(/^0+/, '');
    }

    function parseSheetSmartly(worksheet) {
        let rawJson = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });
        if (rawJson.length === 0) return [];

        let headerIdx = 0;
        for (let i = 0; i < Math.min(rawJson.length, 15); i++) {
            let rowStr = rawJson[i].map(c => String(c)).join(' ');
            if (rowStr.includes('SKU Code') || rowStr.includes('GTIN') || rowStr.includes('Barcode') || rowStr.includes('INVOICE_NO')) {
                headerIdx = i;
                break;
            }
        }

        let headers = rawJson[headerIdx].map(h => String(h).trim());
        let result = [];
        for (let i = headerIdx + 1; i < rawJson.length; i++) {
            let row = rawJson[i];
            if (!row || row.length === 0) continue;
            let obj = {};
            headers.forEach((h, colIdx) => {
                if (h) obj[h] = row[colIdx] !== undefined ? row[colIdx] : "";
            });
            result.push(obj);
        }
        return result;
    }

    function handleFilesUpload(files) {
        if (!files || files.length === 0) return;

        let fileListHtml = "<strong>Uploaded Files:</strong><ul style='margin-top:5px;'>";
        for (let f of files) {
            fileListHtml += `<li>📄 ${f.name}</li>`;
        }
        fileListHtml += "</ul>";
        document.getElementById('file-list').innerHTML = fileListHtml;

        let readPromises = [];
        let parsedDatasets = [];

        for (let i = 0; i < files.length; i++) {
            readPromises.push(new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const data = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    
                    let allRows = [];
                    workbook.SheetNames.forEach(sheetName => {
                        const worksheet = workbook.Sheets[sheetName];
                        const rows = parseSheetSmartly(worksheet);
                        allRows = allRows.concat(rows);
                    });

                    parsedDatasets.push({ fileName: files[i].name, rows: allRows });
                    resolve();
                };
                reader.readAsArrayBuffer(files[i]);
            }));
        }

        Promise.all(readPromises).then(() => {
            mergeAndAnalyzeData(parsedDatasets);
        });
    }

    function mergeAndAnalyzeData(datasets) {
        let masterMap = {};
        globalMergedData = [];

        datasets.forEach(ds => {
            ds.rows.forEach(row => {
                let rawEan = row.Barcode || row.BARCODE || row.GTIN || row['Ean code'] || row.EAN || '';
                let eanKey = cleanKey(rawEan);

                let orderId = row.OrderID || row['PARTY ORDER NO'] || row['Sale Order No'] || row.po || row.INVOICE_NO || 'MYNJ-ORDER';
                let invNo = row.InvoiceNo || row.INVOICE_NO || row.CHALLAN_NO || '-';
                let sku = row.SKU || row['SKU Code'] || row['ITEM CODE'] || row['Item Name'] || row['Vendor Article Number'] || '-';
                let itemName = row.ItemName || row['ITEAM NAME'] || row['ITEM_NAME'] || row['Vendor Article Name'] || 'Item';
                let qty = parseFloat(row.Qty || row.SALE_QTY || row.CHALLAN_QUANTITY || row.Quantity || 1);
                
                let grossAmt = parseFloat(row['GROSS AMOUNT'] || 0);
                let rate = parseFloat(row.Rate || row.RATE || row['Landing Price'] || row.MRP || row.Mrp || 0);
                if (grossAmt > 0 && qty > 0) rate = (grossAmt / qty);

                let boxNo = row.BoxNo || row['box num'] || row.REMARKS || 1;
                if (typeof boxNo === 'string' && boxNo.match(/\d+/)) {
                    boxNo = boxNo.match(/\d+/)[0];
                }

                let lookupKey = eanKey ? eanKey : (orderId + "_" + sku);

                if (!masterMap[lookupKey]) {
                    masterMap[lookupKey] = {
                        OrderID: orderId,
                        InvoiceNo: invNo,
                        SKU: sku,
                        ItemName: itemName,
                        Barcode: rawEan || eanKey,
                        Qty: qty,
                        Rate: rate ? Number(rate.toFixed(3)) : 0,
                        BoxNo: boxNo
                    };
                } else {
                    if (invNo !== '-') masterMap[lookupKey].InvoiceNo = invNo;
                    if (rate > 0) masterMap[lookupKey].Rate = Number(rate.toFixed(3));
                    if (boxNo !== 1) masterMap[lookupKey].BoxNo = boxNo;
                    if (qty > masterMap[lookupKey].Qty) masterMap[lookupKey].Qty = qty;
                }
            });
        });

        globalMergedData = Object.values(masterMap);

        if (globalMergedData.length === 0) {
            alert('Data process nahi ho saka. Kripya check karein ki sahi Excel files upload hui hain.');
            return;
        }

        document.getElementById('controlsArea').style.display = 'block';
        renderSummaryTable(globalMergedData);
        generateSlips(globalMergedData);
    }

    function renderSummaryTable(data) {
        let html = `
            <table class="data-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Order / PO ID</th>
                        <th>Invoice No</th>
                        <th>SKU Code</th>
                        <th>Item Name</th>
                        <th>Barcode / EAN</th>
                        <th>Qty</th>
                        <th>Rate (₹)</th>
                        <th>Box No</th>
                    </tr>
                </thead>
                <tbody>
        `;

        data.forEach((item, idx) => {
            html += `
                <tr>
                    <td>${idx + 1}</td>
                    <td><strong>${item.OrderID}</strong></td>
                    <td>${item.InvoiceNo}</td>
                    <td>${item.SKU}</td>
                    <td>${item.ItemName}</td>
                    <td>${item.Barcode}</td>
                    <td>${item.Qty}</td>
                    <td>${item.Rate}</td>
                    <td>${item.BoxNo}</td>
                </tr>
            `;
        });

        html += `</tbody></table>`;
        document.getElementById('summaryTableContainer').innerHTML = html;
    }

    function filterOrders() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        const filtered = globalMergedData.filter(item => {
            return String(item.OrderID).toLowerCase().includes(query) ||
                   String(item.InvoiceNo).toLowerCase().includes(query) ||
                   String(item.SKU).toLowerCase().includes(query) ||
                   String(item.Barcode).toLowerCase().includes(query) ||
                   String(item.ItemName).toLowerCase().includes(query);
        });

        renderSummaryTable(filtered);
        generateSlips(filtered);
    }

    function generateSlips(data) {
        const container = document.getElementById('slipsContainer');
        container.innerHTML = '';

        const grouped = {};
        data.forEach(row => {
            const key = row.OrderID || 'ORD-MAIN';
            if (!grouped[key]) grouped[key] = [];
            grouped[key].push(row);
        });

        let idx = 0;
        for (let orderId in grouped) {
            idx++;
            const items = grouped[orderId];
            const first = items[0];
            const barcodeId = "barcode-" + idx;

            const slipHtml = `
                <div class="packing-slip">
                    <div class="slip-header">
                        <div>
                            <div class="slip-title">Packing Slip</div>
                            <div style="font-size:13px; margin-top:5px;">
                                <strong>Order/PO:</strong> ${orderId} | 
                                <strong>Invoice:</strong> ${first.InvoiceNo} | 
                                <strong>Box:</strong> ${first.BoxNo}
                            </div>
                        </div>
                        <div class="barcode-container">
                            <svg id="${barcodeId}"></svg>
                        </div>
                    </div>

                    <table class="items-table">
                        <thead>
                            <tr>
                                <th style="width: 8%;">#</th>
                                <th style="width: 25%;">SKU</th>
                                <th style="width: 42%;">Item Description</th>
                                <th style="width: 15%;">Barcode</th>
                                <th style="width: 10%; text-align: center;">Qty</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${items.map((item, i) => `
                                <tr>
                                    <td>${i + 1}</td>
                                    <td>${item.SKU}</td>
                                    <td>${item.ItemName}</td>
                                    <td>${item.Barcode}</td>
                                    <td style="text-align: center;">${item.Qty}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;

            container.insertAdjacentHTML('beforeend', slipHtml);

            JsBarcode("#" + barcodeId, String(orderId), {
                format: "CODE128",
                width: 1.5,
                height: 40,
                displayValue: true,
                fontSize: 12
            });
        }
    }

    function exportMergedExcel() {
        if (globalMergedData.length === 0) return;
        const worksheet = XLSX.utils.json_to_sheet(globalMergedData);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Matched Data");
        XLSX.writeFile(workbook, "Matched_Order_Report.xlsx");
    }
</script>

</body>
</html>
