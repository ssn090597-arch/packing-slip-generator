<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk Packing Slip Generator</title>
    <!-- XLSX library for parsing Excel/CSV files -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- JsBarcode library for barcode rendering -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #eef2f5;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #1a252f;
            margin-bottom: 5px;
        }

        p.subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .upload-section {
            border: 2px dashed #007bff;
            background-color: #f8f9fa;
            padding: 30px;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 20px;
            transition: 0.3s;
        }

        .upload-section:hover {
            background-color: #e9ecef;
        }

        input[type="file"] {
            display: none;
        }

        .custom-file-upload {
            display: inline-block;
            padding: 12px 24px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border-radius: 5px;
            font-weight: bold;
            font-size: 15px;
            transition: 0.2s;
        }

        .custom-file-upload:hover {
            background-color: #0056b3;
        }

        .btn-sample {
            display: inline-block;
            margin-left: 10px;
            padding: 12px 20px;
            background-color: #6c757d;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }

        .btn-sample:hover {
            background-color: #5a6268;
        }

        .btn-print {
            background-color: #28a745;
            color: white;
            font-size: 16px;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            display: none;
        }

        .btn-print:hover {
            background-color: #218838;
        }

        #file-info {
            margin-top: 10px;
            font-weight: bold;
            color: #28a745;
        }

        /* Packing Slip Styling */
        .slips-wrapper {
            margin-top: 30px;
        }

        .packing-slip {
            background: #fff;
            border: 2px solid #222;
            padding: 20px;
            margin-bottom: 30px;
            page-break-after: always;
            border-radius: 4px;
        }

        .slip-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 2px solid #000;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .slip-title {
            font-size: 22px;
            font-weight: bold;
            text-transform: uppercase;
            margin: 0 0 8px 0;
        }

        .meta-info {
            font-size: 13px;
            line-height: 1.5;
        }

        .barcode-container {
            text-align: right;
        }

        .barcode-container svg {
            max-width: 220px;
            height: 50px;
        }

        .address-container {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 15px;
        }

        .address-box {
            width: 48%;
            border: 1px solid #ccc;
            padding: 10px;
            background-color: #fafafa;
            border-radius: 4px;
            font-size: 13px;
        }

        .address-box strong {
            display: block;
            border-bottom: 1px solid #ddd;
            padding-bottom: 4px;
            margin-bottom: 6px;
            color: #1a252f;
        }

        .items-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .items-table th, .items-table td {
            border: 1px solid #333;
            padding: 8px;
            text-align: left;
            font-size: 13px;
        }

        .items-table th {
            background-color: #f0f0f0;
        }

        .slip-footer {
            margin-top: 15px;
            font-size: 11px;
            text-align: center;
            color: #555;
            border-top: 1px dashed #aaa;
            padding-top: 8px;
        }

        /* Print Settings */
        @media print {
            body {
                background: white;
                padding: 0;
            }
            .no-print {
                display: none !important;
            }
            .container {
                box-shadow: none;
                padding: 0;
                max-width: 100%;
            }
            .packing-slip {
                border: 1px solid #000;
                margin-bottom: 0;
                page-break-after: always;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="no-print">
        <h1>Bulk Packing Slip Generator</h1>
        <p class="subtitle">Excel ya CSV file upload karein aur ek saath sabhi orders ke Packing Slips & Barcodes generate karein</p>

        <div class="upload-section">
            <label for="excelFile" class="custom-file-upload">
                📁 Choose CSV / Excel File
            </label>
            <input type="file" id="excelFile" accept=".xlsx, .xls, .csv" onchange="handleFile(event)">
            <button class="btn-sample" onclick="downloadSampleCSV()">📥 Download Sample CSV</button>
            <div id="file-info"></div>
        </div>

        <button id="btnPrint" class="btn-print" onclick="window.print()">🖨️ Print All Packing Slips (PDF)</button>
    </div>

    <!-- Output Area where slips will be generated -->
    <div id="slipsContainer" class="slips-wrapper"></div>
</div>

<script>
    // Sample CSV Download function
    function downloadSampleCSV() {
        const csvContent = "data:text/csv;charset=utf-8," 
            + "OrderID,AWB,Courier,OrderDate,PaymentMode,Channel,SellerDetails,CustomerName,CustomerAddress,SKU,ItemName,Qty\n"
            + "ORD-1001,DEL12345678,Delhivery,2026-08-27,Prepaid,Amazon,\"MyStore Hub, Sector 62, Noida, UP\",Rahul Sharma,\"H.No 45, MG Road, Connaught Place, New Delhi - 110001, Ph: 9876543210\",SKU-BLU-01,Wireless Bluetooth Earbuds,2\n"
            + "ORD-1002,ECOM98765432,Ecom Express,2026-08-27,COD,Flipkart,\"MyStore Hub, Sector 62, Noida, UP\",Priya Singh,\"Flat 202, Sunshine Apts, M G Road, Bengaluru, Karnataka - 560001, Ph: 9123456789\",SKU-WAT-05,Smart Watch Series 7,1";
        
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "sample_packing_slips.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    // Handle File Upload
    function handleFile(e) {
        const file = e.target.files[0];
        if (!file) return;

        document.getElementById('file-info').innerText = "File Uploaded: " + file.name;

        const reader = new FileReader();
        reader.onload = function(event) {
            const data = new Uint8Array(event.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            
            // First sheet read
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            
            // Convert to JSON
            const jsonData = XLSX.utils.sheet_to_json(worksheet);
            
            generateSlips(jsonData);
        };
        reader.readAsArrayBuffer(file);
    }

    // Group items by Order ID or generate individual slips
    function generateSlips(data) {
        const container = document.getElementById('slipsContainer');
        container.innerHTML = ''; // clear previous

        if (data.length === 0) {
            alert('File me koi data nahi mila!');
            return;
        }

        // Group rows by OrderID
        const groupedOrders = {};
        data.forEach(row => {
            const orderId = row.OrderID || 'N/A';
            if (!groupedOrders[orderId]) {
                groupedOrders[orderId] = {
                    info: row,
                    items: []
                };
            }
            groupedOrders[orderId].items.push(row);
        });

        let index = 0;
        for (let orderId in groupedOrders) {
            index++;
            const order = groupedOrders[orderId];
            const info = order.info;
            const barcodeId = "barcode-" + index;

            const slipHtml = `
                <div class="packing-slip">
                    <div class="slip-header">
                        <div>
                            <div class="slip-title">Packing Slip</div>
                            <div class="meta-info">
                                <strong>Order ID:</strong> ${info.OrderID || 'N/A'}<br>
                                <strong>Date:</strong> ${info.OrderDate || 'N/A'}<br>
                                <strong>Channel:</strong> ${info.Channel || 'Direct'}<br>
                                <strong>Payment:</strong> ${info.PaymentMode || 'Prepaid'}
                            </div>
                        </div>
                        <div class="barcode-container">
                            <div style="font-size: 12px; font-weight: bold;">Courier: ${info.Courier || 'Standard'}</div>
                            <svg id="${barcodeId}"></svg>
                        </div>
                    </div>

                    <div class="address-container">
                        <div class="address-box">
                            <strong>Shipped From (Seller):</strong>
                            <div>${(info.SellerDetails || '').replace(/\n/g, '<br>')}</div>
                        </div>
                        <div class="address-box">
                            <strong>Ship To (Customer):</strong>
                            <div><strong>${info.CustomerName || ''}</strong></div>
                            <div>${(info.CustomerAddress || '').replace(/\n/g, '<br>')}</div>
                        </div>
                    </div>

                    <table class="items-table">
                        <thead>
                            <tr>
                                <th style="width: 8%;">#</th>
                                <th style="width: 25%;">SKU</th>
                                <th style="width: 52%;">Item Description</th>
                                <th style="width: 15%; text-align: center;">Qty</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${order.items.map((item, i) => `
                                <tr>
                                    <td>${i + 1}</td>
                                    <td>${item.SKU || '-'}</td>
                                    <td>${item.ItemName || '-'}</td>
                                    <td style="text-align: center;">${item.Qty || 1}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>

                    <div class="slip-footer">
                        Thank you for your order! | Handle with care.
                    </div>
                </div>
            `;

            container.insertAdjacentHTML('beforeend', slipHtml);

            // Render Barcode using AWB or OrderID
            const awbVal = info.AWB || info.OrderID || '00000000';
            JsBarcode("#" + barcodeId, awbVal, {
                format: "CODE128",
                width: 1.6,
                height: 45,
                displayValue: true,
                fontSize: 12
            });
        }

        // Show Print Button
        document.getElementById('btnPrint').style.display = 'block';
    }
</script>

</body>
</html>
