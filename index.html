<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Packing Slip Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f9;
        }
        .container {
            max-width: 800px;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin: 0 auto;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #28a745;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #218838;
        }
        .print-btn {
            background-color: #007bff;
            margin-top: 15px;
        }
        .print-btn:hover {
            background-color: #0056b3;
        }
        @media print {
            .no-print {
                display: none;
            }
            .container {
                box-shadow: none;
                border: none;
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Packing Slip Generator</h2>
    
    <div class="no-print">
        <div class="form-group">
            <label for="orderId">Order ID / Reference No.</label>
            <input type="text" id="orderId" placeholder="Enter Order ID">
        </div>
        <div class="form-group">
            <label for="customerName">Customer Name</label>
            <input type="text" id="customerName" placeholder="Enter Customer Name">
        </div>
        <div class="form-group">
            <label for="address">Shipping Address</label>
            <textarea id="address" rows="3" placeholder="Enter Shipping Address"></textarea>
        </div>
        <div class="form-group">
            <label for="items">Item Details (Quantity & Item Name)</label>
            <textarea id="items" rows="4" placeholder="e.g. 2 x T-Shirt (Blue, L)&#10;1 x Shoes (Size 9)"></textarea>
        </div>
        <button onclick="generateSlip()">Generate Slip</button>
    </div>

    <hr class="no-print" style="margin: 20px 0;">

    <div id="slipOutput" style="display:none;">
        <div style="border: 2px solid #000; padding: 20px;">
            <h3 style="margin-top:0;">PACKING SLIP</h3>
            <p><strong>Order ID:</strong> <span id="outOrderId"></span></p>
            <p><strong>Customer:</strong> <span id="outCustomerName"></span></p>
            <p><strong>Shipping Address:</strong><br><span id="outAddress" style="white-space: pre-line;"></span></p>
            <hr>
            <h4>Items Included:</h4>
            <pre id="outItems" style="font-family: inherit; font-size: 14px;"></pre>
        </div>
        <button class="print-btn no-print" onclick="window.print()">Print Packing Slip</button>
    </div>
</div>

<script>
    function generateSlip() {
        document.getElementById('outOrderId').innerText = document.getElementById('orderId').value;
        document.getElementById('outCustomerName').innerText = document.getElementById('customerName').value;
        document.getElementById('outAddress').innerText = document.getElementById('address').value;
        document.getElementById('outItems').innerText = document.getElementById('items').value;
        
        document.getElementById('slipOutput').style.display = 'block';
    }
</script>

</body>
</html>
